# Virtual workspace manifest: this file declares no package of its own. It lists the member
# crates and holds the settings they share. Members opt in with `<key>.workspace = true`, much
# like inheriting from a shared base config.
#
# Layout: `crates/cargo-testcache` is a thin binary (command line, logging, exit status);
# `crates/cargo-testcache-core` is the library that holds the application's logic, so its
# tests (and other crates) can call it directly. Add crates under `crates/`.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
# Minimum supported Rust version, checked by `just msrv`. `std::fs::File::lock` (the store's
# lock) needs 1.89.
rust-version = "1.89"
authors = ["Peter Grace <pete.grace@gmail.com>"]
publish = false

[workspace.dependencies]
# Internal crates, referenced by path so members can depend on each other.
cargo-testcache-core = { path = "crates/cargo-testcache-core" }

# Application-level errors with `.context()`, used by the binary.
anyhow = "1.0.104"
# Command-line parsing. `derive` gives `#[derive(Parser)]`; `env` lets an `#[arg]` fall back to
# an environment variable.
clap = { version = "4.6.7", features = ["derive", "env"] }
# Reads `.env` without loading it into the process (see `load_config` in main.rs).
dotenvy = "0.15.7"
# Glob matching for `inputs` and `always_run`.
globset = "0.4.21"
# Hex encoding of digests in the store; `serde` adds `hex::serde` for `#[serde(with = ...)]`.
hex = { version = "0.4.3", features = ["serde"] }
# Progress bar on stderr while hashing and running.
indicatif = "0.18.6"
# Data parallelism for hashing executables and input files.
rayon = "1.12.0"
# Wrapper types that keep secrets out of `Debug` output and logs. Not used yet; here so every
# crate that needs it shares one version.
secrecy = "0.10.3"
# The store's JSON lines and Cargo's JSON output.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-256 for every digest in a cache key.
sha2 = "0.11.1"
# Library error enums (`#[derive(Error)]`).
thiserror = "2.0.21"
# Parsing Cargo's configuration files, to see whether they set `[env]`. Only the parser: no
# writer (`display`).
toml = { version = "1.2.0", default-features = false, features = ["std", "serde", "parse"] }
tracing = "0.1.44"
# `json` adds the JSON log format; `env-filter` reads `RUST_LOG`.
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
# Walking the workspace for input files.
walkdir = "2.5.0"

# Hegel property-based testing. Published as `hegeltest`, imported as `hegel`. `static-engine`
# links the engine into the test binary instead of downloading it at test time.
hegeltest = { version = "0.52.0", features = ["static-engine"] }
# Temporary directories for store and fixture tests.
tempfile = "3.27.0"

[workspace.lints.rust]
# Every public item needs a doc comment; `-D warnings` in CI turns this into an error.
missing_docs = "warn"
unsafe_code = "forbid"

# `cfg(dylint_lib = "...")` is set only while dylint runs, for `#[cfg_attr(dylint_lib = ...,
# allow(...))]` exemptions; this stops ordinary builds warning that the cfg is unknown.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(dylint_lib, values(any()))"] }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
# Slower release builds for a smaller, faster binary.
lto = true
codegen-units = 1

# Lint libraries `just dylint` runs. Each is compiled against the driver `cargo-dylint` builds;
# CI installs cargo-dylint 6.3.0 (see ci.yml), which loads these v6.0.4 libraries. When bumping
# a tag, check `just dylint` still loads every library before changing CI.
[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/trailofbits/dylint", tag = "v6.0.4", pattern = "examples/supplementary" },
    { git = "https://github.com/hypotheosis/hyp-rust-policy-lints", tag = "v0.1.2", pattern = "lints/*" },
]

