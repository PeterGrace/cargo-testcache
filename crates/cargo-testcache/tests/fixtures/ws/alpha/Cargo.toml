[package]
name = "alpha"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.89"
authors = ["Example Author <author@example.com>", "Second Author"]
description = "Fixture library."
license-file = "LICENSE.txt"
build = "build.rs"
publish = false

[dev-dependencies]
probe = { path = "../probe" }

[package.metadata.testcache]
inputs = ["fixtures/**"]

# Only the integration test `tests/reads_input.rs` reads this file, so changing it reruns that
# binary alone, not alpha's unit tests.
[package.metadata.testcache.targets.reads_input]
inputs = ["reads_input_data/**"]
